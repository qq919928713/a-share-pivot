name: refresh dashboard data

# 15:20 Beijing time (07:20 UTC), Monday to Friday.
on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append today's close
        run: python update.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(data): refresh to $(date -u +%F)"
          git push
